name: NMT Brain Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nmt_public_probe.py"
      - ".github/workflows/nmt-brain-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - name: Probe public NMT data
        run: python nmt_public_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: nmt-public-probe-${{ github.run_id }}
          path: nmt_probe.json
          retention-days: 3
