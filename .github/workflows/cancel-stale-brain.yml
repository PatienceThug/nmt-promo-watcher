name: Cancel Stale Brain Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-brain.yml"

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/out -w "%{http_code}" -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/runs/35696685544/cancel")
          cat /tmp/out || true
          echo "HTTP $code"
          if [[ "$code" != "202" && "$code" != "409" ]]; then exit 1; fi
