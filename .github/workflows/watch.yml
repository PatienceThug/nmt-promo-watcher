name: NMT Promo Watcher (Silent)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify only — no scan delivery, no Telegram
        run: |
          python -m py_compile watcher_v3.py watcher_v4.py telegram_notify.py
          python -m unittest -v test_telegram_notify.py
          python -m py_compile merge_state.py persist_state.py telegram_radar.py
          python -m unittest -v test_radar.py test_telegram_paging.py
