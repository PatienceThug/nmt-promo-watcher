name: NMT Promo Watcher
# X API secret verification trigger

on:
  push:
    branches: [main]
    paths:
      - "watcher_v3.py"
      - "watcher_v4.py"
      - "social_watcher.py"
      - "social_watcher_v2.py"
      - "telegram_notify.py"
      - "requirements.txt"
      - ".github/workflows/watch.yml"
  schedule:
    # Each cron obeys GitHub's 5-minute minimum. Staggering them attempts a scan
    # roughly every minute, but GitHub may still delay scheduled jobs under load.
    - cron: "*/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nmt-promo-watcher
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify watcher syntax
        run: |
          python -m py_compile watcher_v3.py
          python -m py_compile watcher_v4.py
          python -m py_compile social_watcher.py
          python -m py_compile social_watcher_v2.py
          python -m py_compile telegram_notify.py

      - name: Choose fast or deep scan
        id: mode
        shell: bash
        run: |
          event="${{ github.event_name }}"
          run_no="${{ github.run_number }}"

          if [[ "$event" == "workflow_dispatch" || "$event" == "push" ]]; then
            echo "mode=deep" >> "$GITHUB_OUTPUT"
            echo "Deep scan forced by $event"
          elif (( run_no % 5 == 0 )); then
            echo "mode=deep" >> "$GITHUB_OUTPUT"
            echo "Deep scan: Telegram + mirrors + web + X + YouTube"
          else
            echo "mode=fast" >> "$GITHUB_OUTPUT"
            echo "Fast scan: Telegram + NMT pages + official X"
          fi

      - name: Scan Telegram and web sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_THREAD: "1"
          PYTHONUNBUFFERED: "1"
        run: python watcher_v4.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Scan X and YouTube social sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python social_watcher_v2.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Send Telegram push notifications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python telegram_notify.py

      - name: Persist watcher state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [ -f seen_codes.json ] && git add seen_codes.json || true
          [ -f social_state.json ] && git add social_state.json || true
          [ -f telegram_state.json ] && git add telegram_state.json || true

          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "Update NMT promo watcher state"
          git pull --rebase origin main
          git push
