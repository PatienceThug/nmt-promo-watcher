name: NMT Promo Watcher
# Free-only social monitoring mode

on:
  push:
    branches: [main]
    paths:
      - "watcher_v3.py"
      - "watcher_v4.py"
      - "social_watcher.py"
      - "social_watcher_v2.py"
      - "social_watcher_v3.py"
      - "telegram_notify.py"
      - "merge_state.py"
      - "requirements.txt"
      - ".github/workflows/watch.yml"
  schedule:
    # One run every five minutes prevents overlapping scans and stale queues.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nmt-promo-watcher
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify watcher syntax
        run: |
          python -m py_compile watcher_v3.py
          python -m py_compile watcher_v4.py
          python -m py_compile social_watcher.py
          python -m py_compile social_watcher_v2.py
          python -m py_compile social_watcher_v3.py
          python -m py_compile telegram_notify.py
          python -m py_compile merge_state.py
          python -c "import watcher_v3 as w; assert 'TEST123' in w.extract_codes('promo code: TEST123')"
          python -c "import social_watcher_v3 as s; assert s.is_nmt_related('NMT.GG promo')"

      - name: Choose fast or deep scan
        id: mode
        shell: bash
        run: |
          event="${{ github.event_name }}"
          run_no="${{ github.run_number }}"

          if [[ "$event" == "workflow_dispatch" || "$event" == "push" ]]; then
            echo "mode=deep" >> "$GITHUB_OUTPUT"
            echo "Deep scan forced by $event"
          elif (( run_no % 5 == 0 )); then
            echo "mode=deep" >> "$GITHUB_OUTPUT"
            echo "Deep scan: Telegram + mirrors + web + free X + YouTube metadata/comments/Shorts"
          else
            echo "mode=fast" >> "$GITHUB_OUTPUT"
            echo "Fast scan: Telegram + NMT pages + free official X"
          fi

      - name: Scan Telegram and web sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_THREAD: "1"
          PYTHONUNBUFFERED: "1"
        run: python watcher_v4.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Scan free X YouTube comments and Shorts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: python social_watcher_v3.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Send Telegram push notifications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python telegram_notify.py

      - name: Persist watcher state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          state_dir="$(mktemp -d)"
          state_files=(seen_codes.json social_state.json social_state_v3.json telegram_state.json)
          for file in "${state_files[@]}"; do
            [ -f "$file" ] && cp "$file" "$state_dir/$file"
          done

          # Rebase cleanly first, then merge this scan's state into the newest
          # remote state. This avoids losing detections when code/state changes
          # land while a scan is running.
          git restore -- "${state_files[@]}" 2>/dev/null || true
          git pull --rebase origin main

          for file in "${state_files[@]}"; do
            [ -f "$state_dir/$file" ] || continue
            python merge_state.py "$file" "$state_dir/$file"
            git add "$file"
          done

          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "Update NMT promo watcher state"
          git push

