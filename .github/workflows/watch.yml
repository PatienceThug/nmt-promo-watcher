name: NMT Promo Watcher
# Free-only social monitoring mode

on:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/watch.yml"
  push:
    branches: [main]
    paths:
      - "watcher_v3.py"
      - "watcher_v4.py"
      - "social_watcher.py"
      - "social_watcher_v2.py"
      - "social_watcher_v3.py"
      - "telegram_notify.py"
      - "test_telegram_notify.py"
      - "test_social_watcher.py"
      - "merge_state.py"
      - "requirements.txt"
      - ".github/workflows/watch.yml"
  schedule:
    # Five-minute target; GitHub may delay runs. Concurrency prevents overlap.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nmt-promo-watcher
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify watcher syntax
        run: |
          python -m py_compile watcher_v3.py
          python -m py_compile watcher_v4.py
          python -m py_compile social_watcher.py
          python -m py_compile social_watcher_v2.py
          python -m py_compile social_watcher_v3.py
          python -m py_compile telegram_notify.py
          python -m unittest -v test_telegram_notify.py
          python -m unittest -v test_social_watcher.py
          python -m py_compile merge_state.py
          python -c "import watcher_v3 as w; assert 'TEST123' in w.extract_codes('promo code: TEST123')"
          python -c "import social_watcher_v3 as s; assert s.is_nmt_related('NMT.GG promo')"

      - name: Choose fast or deep scan
        id: mode
        shell: bash
        run: |
          event="${{ github.event_name }}"
          run_no="${{ github.run_number }}"

          if [[ "$event" == "workflow_dispatch" || "$event" == "push" ]]; then
            echo "mode=deep" >> "$GITHUB_OUTPUT"
            echo "Deep scan forced by $event"
          elif (( run_no % 5 == 0 )); then
            echo "mode=deep" >> "$GITHUB_OUTPUT"
            echo "Deep scan: Telegram + mirrors + web + free X + YouTube metadata/comments/Shorts"
          else
            echo "mode=fast" >> "$GITHUB_OUTPUT"
            echo "Fast scan: Telegram + NMT pages + free official X"
          fi

      - name: Scan Telegram and web sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_THREAD: "1"
          PYTHONUNBUFFERED: "1"
        run: python watcher_v4.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Scan free X YouTube comments and Shorts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: python social_watcher_v3.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Record scan failure in GitHub Issues
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ NMT WATCHER HEALTH: Workflow " + context.runId;
            const body = "NMT taraması başarısız oldu. Yeni kodlar kaçırılmış olabilir.\n\n" +
              "Çalıştırma: " + context.serverUrl + "/" + context.repo.owner + "/" +
              context.repo.repo + "/actions/runs/" + context.runId;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "all", per_page: 100
            });
            if (!issues.some(issue => !issue.pull_request && issue.title === title)) {
              await github.rest.issues.create({...context.repo, title, body});
            }

      - name: Send Telegram push notifications
        id: notify
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python telegram_notify.py

      - name: Persist watcher state
        id: persist
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          state_dir="$(mktemp -d)"
          trap 'rm -rf "$state_dir"' EXIT
          state_files=(seen_codes.json social_state.json social_state_v3.json telegram_state.json)
          for file in "${state_files[@]}"; do
            [ -f "$file" ] && cp "$file" "$state_dir/$file"
          done

          # Retry from the latest remote state each time. This survives transient
          # fetch/push failures and non-fast-forward races without losing detections.
          for attempt in 1 2 3; do
            echo "Persist attempt $attempt/3"

            if ! git fetch origin main; then
              echo "git fetch failed"
              sleep $((attempt * 2))
              continue
            fi

            git reset --hard origin/main

            for file in "${state_files[@]}"; do
              [ -f "$state_dir/$file" ] || continue
              python merge_state.py "$file" "$state_dir/$file"
              git add "$file"
            done

            if git diff --cached --quiet; then
              echo "No state changes"
              exit 0
            fi

            git commit -m "Update NMT promo watcher state"

            if git push origin HEAD:main; then
              echo "Watcher state persisted"
              exit 0
            fi

            echo "git push failed; retrying from latest origin/main"
            sleep $((attempt * 2))
          done

          echo "State persistence failed after 3 attempts"
          exit 1

      - name: Record notification or state failure
        if: ${{ failure() && (steps.notify.outcome == 'failure' || steps.persist.outcome == 'failure') }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ NMT WATCHER HEALTH: Workflow delivery " + context.runId;
            const failed = [];
            if ("${{ steps.notify.outcome }}" === "failure") failed.push("Telegram bildirimi");
            if ("${{ steps.persist.outcome }}" === "failure") failed.push("durum kaydı");
            const body = (failed.length ? failed.join(" ve ") : "Teslimat") +
              " başarısız oldu. Tarama sonucu ayrıca kontrol edilmelidir.\n\n" +
              context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo +
              "/actions/runs/" + context.runId;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "all", per_page: 100
            });
            if (!issues.some(issue => !issue.pull_request && issue.title === title)) {
              await github.rest.issues.create({...context.repo, title, body});
            }
