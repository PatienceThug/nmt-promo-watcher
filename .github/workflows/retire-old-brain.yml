name: Retire Old NMT Brain Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-old-brain.yml"

permissions:
  actions: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded worker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/runs/35694672477/cancel"
